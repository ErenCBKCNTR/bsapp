name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Inject Supabase Secrets
        run: |
          echo "SUPABASE_URL=\"${{ secrets.SUPABASE_URL }}\"" > local.properties
          echo "SUPABASE_KEY=\"${{ secrets.SUPABASE_ANON_KEY }}\"" >> local.properties
          echo "LIVEKIT_URL=\"${{ secrets.LIVEKIT_URL }}\"" >> local.properties
          echo "LIVEKIT_API_KEY=\"${{ secrets.LIVEKIT_API_KEY }}\"" >> local.properties
          echo "LIVEKIT_API_SECRET=\"${{ secrets.LIVEKIT_API_SECRET }}\"" >> local.properties

      - name: Build with Gradle
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk